
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Bloom</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf9;
      padding: 35px;
      border: 1px solid #efebe3;
      border-radius: 22px;
      box-shadow: 0 15px 50px #47321b12;
    }
    .auth-brand {
      text-decoration: none;
      color: #7866dc;
      font-size: 29px;
      font-weight: 800;
    }
    .auth-card h1 { font-size: 27px; margin: 28px 0 8px; }
    .auth-subtitle { color: #858493; line-height: 1.7; margin-bottom: 25px; }
    .auth-card label { margin-top: 17px; }
    .auth-card input { margin-bottom: 3px; }
    .auth-card button { margin-top: 22px; }
    .auth-message { font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    .auth-footer { margin-top: 23px; text-align: center; color: #858493; font-size: 12px; }
    .auth-footer a { color: #7866dc; font-weight: 700; }
    .back-home { display: inline-block; margin-top: 22px; color: #7866dc; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">✳ bloom.</a>
      <h1>Create your account</h1>
      <p class="auth-subtitle">A fresh start for your finances begins here.</p>

      <form id="registerForm">
        <label for="fullName">Your name</label>
        <input id="fullName" type="text" placeholder="Enter your name"
          autocomplete="name" maxlength="80" required>

        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com"
          autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters"
          autocomplete="new-password" minlength="8" required>

        <button class="primary-btn full-btn" id="registerButton" type="submit">
          Create account <span>↗</span>
        </button>
        <p id="registerMessage" class="auth-message" role="status"></p>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
      <a class="back-home" href="index.html">← Back to dashboard</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="register.js"></script>
</body>
</html>
