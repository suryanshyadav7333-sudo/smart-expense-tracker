
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Bloom Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    
.forgot-password-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}

.forgot-password-row a {
  color: #7866dc;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}

.forgot-password-row a:hover {
  text-decoration: underline;
}

    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fffdf9;
      padding: 35px;
      border: 1px solid #efebe3;
      border-radius: 22px;
      box-shadow: 0 15px 50px #47321b12;
    }
    .auth-brand {
      color: #7866dc;
      font-size: 29px;
      font-weight: 800;
      text-decoration: none;
    }
    .auth-card h1 { font-size: 27px; margin: 28px 0 8px; }
    .auth-subtitle { color: #858493; line-height: 1.7; margin-bottom: 25px; }
    .auth-card label { margin-top: 18px; }
    .auth-card button { margin-top: 24px; }
    .auth-message { font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    .auth-footer { margin-top: 23px; text-align: center; color: #858493; font-size: 12px; }
    .auth-footer a, .back-home { color: #7866dc; font-weight: 700; }
    .back-home { display: inline-block; margin-top: 22px; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <a class="auth-brand" href="index.html">✳ bloom.</a>

      <h1>Welcome back!</h1>
      <p class="auth-subtitle">Your finances, all in one calm little place.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

<div class="forgot-password-row">
  <a href="#" id="forgotPasswordLink">Forgot password?</a>
</div>

        <button class="primary-btn full-btn" id="loginButton" type="submit">
          Log in <span>↗</span>
        </button>

        <p id="loginMessage" class="auth-message" role="status"></p>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>

      <a class="back-home" href="index.html">← Back to dashboard</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
