
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Bloom</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reset-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: #fffdf9;
      border: 1px solid #efebe3;
      border-radius: 22px;
      box-shadow: 0 15px 50px #47321b12;
    }

    .reset-brand {
      color: #7866dc;
      font-size: 29px;
      font-weight: 800;
      text-decoration: none;
    }

    .reset-card h1 {
      margin: 25px 0 8px;
    }

    .reset-card p {
      color: #858493;
      line-height: 1.7;
    }

    .reset-card label {
      display: block;
      margin-top: 18px;
    }

    .reset-card button {
      width: 100%;
      margin-top: 24px;
    }

    #resetMessage {
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="reset-wrap">
    <section class="reset-card">
      <a class="reset-brand" href="login.html">✳ bloom.</a>

      <h1>Set a new password</h1>
      <p>Choose a new password for your account.</p>

      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          type="password"
          placeholder="At least 8 characters"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="Enter the password again"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button class="primary-btn full-btn" id="resetButton" type="submit">
          Update password
        </button>

        <p id="resetMessage" role="status"></p>
      </form>

      <p><a href="login.html">Return to login</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
